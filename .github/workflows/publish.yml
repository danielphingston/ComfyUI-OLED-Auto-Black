name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pytest
      - name: Run tests
        # Tests run in an isolated folder: the repo root is a ComfyUI package
        # (__init__.py imports torch), which pytest would otherwise try to import.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/t" && cp oled_core.py tests/test_core.py "$RUNNER_TEMP/t/"
          cd "$RUNNER_TEMP/t"
          python -m pytest -q -rA -p no:cacheprovider 2>&1 | tee pytest.log || {
            grep -E "FAILED|Error|assert" pytest.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
